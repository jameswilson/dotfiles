version = 1

[targets.codex]
kind = "concat"
output = "dist/codex/AGENTS.md"
native = "~/.codex/AGENTS.md"
prefix = """<!-- Generated by ~/.config/agent-instructions/bin/render. -->
# Global agent instructions
"""
sources = [
  "source/preferences/response-style.md",
  "source/preferences/reasoning.md",
  "source/preferences/safety-and-policy.md",
  "source/preferences/code-and-sources.md",
  "source/preferences/thread-naming.md",
  "source/preferences/formatting.md",
  "source/procedures/engineering.md",
  "source/procedures/remote-auth.md",
  "source/procedures/git.md",
  "source/procedures/drupal-ddev-jira.md",
  "source/procedures/browser-and-shell.md",
  "source/procedures/code-discovery.md",
  "source/procedures/dependency-selection.md",
]

[targets.cursor]
kind = "concat"
output = "dist/cursor/shared-agent-instructions.mdc"
native = "~/.cursor/rules/shared-agent-instructions.mdc"
prefix = """---
description: Shared personal agent preferences and engineering procedures
alwaysApply: true
---

# Shared agent instructions
"""
sources = [
  "source/preferences/response-style.md",
  "source/preferences/reasoning.md",
  "source/preferences/safety-and-policy.md",
  "source/preferences/code-and-sources.md",
  "source/preferences/thread-naming.md",
  "source/preferences/formatting.md",
  "source/procedures/engineering.md",
  "source/procedures/git.md",
  "source/procedures/drupal-ddev-jira.md",
  "source/procedures/browser-and-shell.md",
  "source/procedures/code-discovery.md",
  "source/procedures/dependency-selection.md",
]

[targets.cursor_user_rules]
kind = "cursor-user-rules"
output = "dist/cursor/user-rules.json"
manifest = "source/adapters/cursor/user-rules.toml"

[targets.chatgpt_custom_instructions]
kind = "copy"
output = "dist/chatgpt.com/custom-instructions.md"
source = "source/adapters/chatgpt.com/custom-instructions.md"
max_chars = 1450

[targets.chatgpt_memory_summary]
kind = "memory-summary"
output = "dist/chatgpt.com/memory-summary.md"

[targets.chatgpt_occupation]
kind = "occupation"
output = "dist/chatgpt.com/about-you-occupation.txt"

[targets.chatgpt_more_about_you]
kind = "more-about-you"
output = "dist/chatgpt.com/more-about-you.md"
max_chars = 1500
